<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{email/fragments/layout :: wrapper(~{::content})}">
  <div th:fragment="content">
    <h2 style="margin-top: 0; color: #111827; font-size: 20px; font-weight: 600;">New Task Assigned</h2>
    <p style="font-size: 16px; color: #4b5563;">
      <span th:text="${assignedByName}"></span> has assigned you the task
      <strong th:text="${issueName}"></strong> in project
      <strong th:text="${projectName}"></strong>.
    </p>
    <div style="background-color: #f3f4f6; border-left: 4px solid #6d28d9; padding: 15px 20px; margin: 20px 0; border-radius: 0 8px 8px 0;">
      <p style="margin: 5px 0; font-size: 14px;"><strong>Project:</strong> <span th:text="${projectName}"></span></p>
      <p style="margin: 5px 0; font-size: 14px;"><strong>Task:</strong> <span th:text="${issueName}"></span></p>
      <p style="margin: 5px 0; font-size: 14px;"><strong>Assigned by:</strong> <span th:text="${assignedByName}"></span></p>
    </div>
    <div style="text-align: center; margin: 30px 0 10px 0;">
      <a th:href="${issueUrl}" style="background-color: #6d28d9; color: #ffffff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; display: inline-block; font-size: 15px;">View Task Details</a>
    </div>
  </div>
</div>
</body>
</html>
