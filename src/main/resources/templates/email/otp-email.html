<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{email/fragments/layout :: wrapper(~{::content})}">
  <div th:fragment="content">
    <h2 style="margin-top: 0; color: #111827; font-size: 20px; font-weight: 600;">Account Verification Code</h2>
    <p style="font-size: 16px; color: #4b5563;">
      Hello,
    </p>
    <p style="font-size: 16px; color: #4b5563;">
      Thank you for registering on Rookwork. Here is your One-Time Password (OTP) to verify your account:
    </p>
    <div style="text-align: center; margin: 30px 0;">
      <span style="font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #6d28d9; border: 1px dashed #6d28d9; padding: 10px 20px; border-radius: 8px; background-color: #f5f3ff; display: inline-block;"
            th:text="${otpCode}">
        123456
      </span>
    </div>
    <p style="font-size: 14px; color: #9ca3af; text-align: center;">
      This verification code is valid for 5 minutes. Please do not share this code with anyone.
    </p>
  </div>
</div>
</body>
</html>
