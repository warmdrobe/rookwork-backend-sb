<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{email/fragments/layout :: wrapper(~{::content})}">
  <div th:fragment="content">
    <h2 style="margin-top: 0; color: #111827; font-size: 20px; font-weight: 600;">Event Invitation</h2>
    <p style="font-size: 16px; color: #4b5563;">
      <span th:text="${creatorName}"></span> has invited you to join the event
      <strong th:text="${eventName}"></strong>
      <span th:if="${projectName}"> in project <strong th:text="${projectName}"></strong></span>.
    </p>
    <div style="background-color: #f3f4f6; border-left: 4px solid #6d28d9; padding: 15px 20px; margin: 20px 0; border-radius: 0 8px 8px 0;">
      <p style="margin: 5px 0; font-size: 14px;"><strong>Event:</strong> <span th:text="${eventName}"></span></p>
      <p th:if="${eventDescription}" style="margin: 5px 0; font-size: 14px;"><strong>Description:</strong> <span th:text="${eventDescription}"></span></p>
      <p style="margin: 5px 0; font-size: 14px;"><strong>Time:</strong> <span th:text="${eventTime}"></span></p>
      <p th:if="${location}" style="margin: 5px 0; font-size: 14px;"><strong>Location:</strong> <span th:text="${location}"></span></p>
    </div>
    <div style="text-align: center; margin: 30px 0 10px 0;">
      <a th:href="${calendarUrl}" style="background-color: #6d28d9; color: #ffffff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; display: inline-block; font-size: 15px;">View on Calendar</a>
    </div>
  </div>
</div>
</body>
</html>
