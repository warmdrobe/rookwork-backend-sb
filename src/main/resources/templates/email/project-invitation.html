<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{email/fragments/layout :: wrapper(~{::content})}">
  <div th:fragment="content">
    <h2 style="margin-top: 0; color: #111827; font-size: 20px; font-weight: 600;">Project Invitation</h2>
    <p style="font-size: 16px; color: #4b5563;">
      <strong th:text="${invitedByName}"></strong> has invited you to join the project
      <strong th:text="${projectName}"></strong> on Rookwork.
    </p>
    <div th:if="${isNewUser}" style="background-color: #eff6ff; border-left: 4px solid #3b82f6; padding: 15px 20px; margin: 20px 0; border-radius: 0 8px 8px 0; color: #1e3a8a;">
      You do not have a Rookwork account yet. Please click the button below to register a new account. After successful registration, you will be automatically added to this project.
    </div>
    <div style="text-align: center; margin: 30px 0 10px 0;">
      <a th:href="${invitationUrl}" style="background-color: #6d28d9; color: #ffffff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; display: inline-block; font-size: 15px;"
         th:text="${isNewUser} ? 'Register and Join' : 'Accept Invitation'">
        Join Project
      </a>
    </div>
  </div>
</div>
</body>
</html>
