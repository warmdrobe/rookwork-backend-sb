name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Copy JAR to S3
        run: |
          aws s3 cp target/*.jar s3://${{ secrets.S3_BUCKET }}/rookwork-backend.jar

      - name: Deploy on EC2-1 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID_1 }} \
            --document-name "AWS-RunShellScript" \
            --region ap-southeast-1 \
            --parameters 'commands=[
              "aws s3 cp s3://${{ secrets.S3_BUCKET }}/rookwork-backend.jar ~/rookwork-backend-sb/rookwork-backend.jar",
              "cd ~/rookwork-backend-sb",
              "sudo docker stop rookwork-backend || true",
              "sudo docker rm rookwork-backend || true",
              "sudo docker rmi rookwork-backend || true",
              "sudo docker build --no-cache -t rookwork-backend .",
              "sudo docker run -d --restart always --name rookwork-backend -p 8080:8080 -e DB_URL=${{ secrets.DB_URL }} -e DB_USERNAME=${{ secrets.DB_USERNAME }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} -e JWT_SECRET=${{ secrets.JWT_SECRET }} -e JWT_EXPIRATION=604800000 -e JWT_REFRESH_EXPIRATION=2592000000 -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} -e APP_EMAIL_FROM=${{ secrets.APP_EMAIL_FROM }} rookwork-backend"
            ]'

      - name: Deploy on EC2-2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID_2 }} \
            --document-name "AWS-RunShellScript" \
            --region ap-southeast-1 \
            --parameters 'commands=[
              "aws s3 cp s3://${{ secrets.S3_BUCKET }}/rookwork-backend.jar ~/rookwork-backend-sb/rookwork-backend.jar",
              "cd ~/rookwork-backend-sb",
              "sudo docker stop rookwork-backend || true",
              "sudo docker rm rookwork-backend || true",
              "sudo docker rmi rookwork-backend || true",
              "sudo docker build --no-cache -t rookwork-backend .",
              "sudo docker run -d --restart always --name rookwork-backend -p 8080:8080 -e DB_URL=${{ secrets.DB_URL }} -e DB_USERNAME=${{ secrets.DB_USERNAME }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} -e JWT_SECRET=${{ secrets.JWT_SECRET }} -e JWT_EXPIRATION=604800000 -e JWT_REFRESH_EXPIRATION=2592000000 -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} -e APP_EMAIL_FROM=${{ secrets.APP_EMAIL_FROM }} rookwork-backend"
            ]'
